// Sync code management — used as the Firestore document path key
const SYNC_CODE_KEY = 'life_manager_sync_code';

function getSyncCode() {
 return localStorage.getItem(SYNC_CODE_KEY);
}

function setSyncCode(code) {
 localStorage.setItem(SYNC_CODE_KEY, code);
}

function generateSyncCode() {
 const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
 let code = '';
 for (let i = 0; i < 6; i++) {
   code += chars[Math.floor(Math.random() * chars.length)];
 }
 return code;
}

function ensureSyncCode() {

   code = generateSyncCode();
   setSyncCode(code);
 }

 // ===== Date Utilities =====
 formatDate(date) {
   if (!date) return '';

   const m = String(d.getMonth() + 1).padStart(2, '0');

 parseDate(dateStr) {
   if (!dateStr) return new Date();
   if (dateStr.includes('T')) return new Date(dateStr);
   return new Date(dateStr + 'T00:00:00');
 },

 getDayOfWeek(date) {
   const d = date ? new Date(date) : new Date();
   return d.getDay(); // 0=Sunday, 1=Monday, ..., 6=Saturday
 },

 getDayName(dayOfWeek) {
   const names = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
   return names[dayOfWeek] || '';
 },

 getDayNameShort(dayOfWeek) {

   return names[dayOfWeek] || '';
 },

 getMonthDays(year, month) {
   // month is 0-indexed
   return new Date(year, month + 1, 0).getDate();

 getMonthMatrix(year, month) {
   // Returns array of weeks, each with 7 days
   const firstDay = new Date(year, month, 1);
   const startDayOfWeek = (firstDay.getDay() + 6) % 7;
   const daysInMonth = this.getMonthDays(year, month);
   const daysInPrevMonth = this.getMonthDays(year, month - 1);

   const weeks = [];
   let currentDay = 1;
   let nextMonthDay = 1;

   // Calculate number of weeks needed
   const totalCells = Math.ceil((startDayOfWeek + daysInMonth) / 7) * 7;

   for (let i = 0; i < totalCells; i++) {
     const weekIndex = Math.floor(i / 7);
     if (!weeks[weekIndex]) weeks[weekIndex] = [];

     const dayIndex = i % 7;
     if (i < startDayOfWeek) {
       // Previous month
       const day = daysInPrevMonth - startDayOfWeek + i + 1;
       const prevMonth = month - 1 < 0 ? 11 : month - 1;
       const prevYear = month - 1 < 0 ? year - 1 : year;
       weeks[weekIndex][dayIndex] = {
         day, year: prevYear, month: prevMonth,
         isCurrentMonth: false,
         dateStr: this.formatDate(new Date(prevYear, prevMonth, day))
       };
     } else if (currentDay <= daysInMonth) {
       weeks[weekIndex][dayIndex] = {
         day: currentDay, year, month,
         isCurrentMonth: true,
         dateStr: this.formatDate(new Date(year, month, currentDay))
       };
       currentDay++;
     } else {
       // Next month
       const nextMonth = month + 1 > 11 ? 0 : month + 1;
       const nextYear = month + 1 > 11 ? year + 1 : year;
       weeks[weekIndex][dayIndex] = {
         day: nextMonthDay, year: nextYear, month: nextMonth,
         isCurrentMonth: false,
         dateStr: this.formatDate(new Date(nextYear, nextMonth, nextMonthDay))
       };
       nextMonthDay++;
     }
   }
   return weeks;
 },

// ===== js/db.js =====
/**
* 数据层 — IndexedDB 本地存储 + Firebase Firestore 云端同步
* 统一 API，模块只需调用 DB.xxx 即可，无需关心数据来自哪里
*/

const DB = {
 db: null,
 firestore: null,
 syncCode: null,
 listeners: {},
 useCloud: false,

 // ===== IndexedDB =====
 async _openIDB() {
   if (this.db) return this.db;
   return new Promise((resolve, reject) => {
     const req = indexedDB.open('life_manager', 1);
     req.onupgradeneeded = (e) => {
       const db = e.target.result;
       const stores = ['transactions', 'events', 'fitnessPlans', 'dietPlans', 'categories', 'meta'];
       stores.forEach(s => {
         if (!db.objectStoreNames.contains(s)) {
           db.createObjectStore(s, { keyPath: 'id' });
         }
       });
     };
     req.onsuccess = () => { this.db = req.result; resolve(req.result); };
     req.onerror = () => reject(req.error);
   });
 },

 async _idbGetAll(store) {
   const db = await this._openIDB();
   return new Promise((resolve, reject) => {
     const tx = db.transaction(store, 'readonly');
     const req = tx.objectStore(store).getAll();
     req.onsuccess = () => resolve(req.result || []);
     req.onerror = () => reject(req.error);
   });
 },

 async _idbPut(store, data) {
   const db = await this._openIDB();
   return new Promise((resolve, reject) => {
     const tx = db.transaction(store, 'readwrite');
     tx.objectStore(store).put(data);
     tx.oncomplete = () => resolve(data);
     tx.onerror = () => reject(tx.error);
   });
 },

 async _idbDelete(store, id) {
   const db = await this._openIDB();
   return new Promise((resolve, reject) => {
     const tx = db.transaction(store, 'readwrite');
     tx.objectStore(store).delete(id);
     tx.oncomplete = () => resolve();
     tx.onerror = () => reject(tx.error);
   });
 },

 async _idbClear(store) {
   const db = await this._openIDB();
   return new Promise((resolve, reject) => {
     const tx = db.transaction(store, 'readwrite');
     tx.objectStore(store).clear();
     tx.oncomplete = () => resolve();
     tx.onerror = () => reject(tx.error);
   });
 },

 // ===== Firebase Firestore =====
 _initFirestore() {
   if (!isFirebaseConfigured()) return false;
   try {
     if (!firebase.apps.length) {
       firebase.initializeApp(FIREBASE_CONFIG);
     }
     this.firestore = firebase.firestore();
     this.syncCode = ensureSyncCode();
     this.useCloud = true;
     return true;
   } catch (e) {
     console.error('Firestore init failed:', e);
     return false;
   }
 },

 _collection(store) {
   return this.firestore
     .collection('data')
     .doc(this.syncCode)
     .collection(store);
 },

 async _firestoreGetAll(store) {
   const snap = await this._collection(store).get();
   return snap.docs.map(d => d.data());
 },

 async _firestorePut(store, data) {
   await this._collection(store).doc(data.id).set(data);
   return data;
 },

 async _firestoreDelete(store, id) {
   await this._collection(store).doc(id).delete();
 },

 async _firestoreClear(store) {
   const snap = await this._collection(store).get();
   const batch = this.firestore.batch();
   snap.docs.forEach(d => batch.delete(d.ref));
   await batch.commit();
 },

 // Real-time listeners for cloud sync
 _subscribeCloud(store, callback) {
   return this._collection(store).onSnapshot((snap) => {
     const items = snap.docs.map(d => d.data());
     callback(items);
   });
 },

 // ===== Unified API =====
 async init() {
   await this._openIDB();
   this._initFirestore();
   if (this.useCloud) {
     // Sync local from cloud on init
     await this._syncFromCloud();
   }
 },

 async _syncFromCloud() {
   const stores = ['transactions', 'events', 'fitnessPlans', 'dietPlans', 'categories'];
   for (const s of stores) {
     const cloudItems = await this._firestoreGetAll(s);
     // Overwrite local with cloud data
     await this._idbClear(s);
     for (const item of cloudItems) {
       await this._idbPut(s, item);
     }
   }
 },

 async getAll(store) {
   return this._idbGetAll(store);
 },

 async add(store, data) {
   const item = { ...data, id: data.id || Utils.generateId(), createdAt: Date.now() };
   await this._idbPut(store, item);
   if (this.useCloud) await this._firestorePut(store, item);
   return item;
 },

 async update(store, id, updates) {
   const all = await this._idbGetAll(store);
   const existing = all.find(x => x.id === id);
   if (!existing) return null;
   const updated = { ...existing, ...updates, updatedAt: Date.now() };
   await this._idbPut(store, updated);
   if (this.useCloud) await this._firestorePut(store, updated);
   return updated;
 },

 async put(store, data) {
   const item = { ...data, id: data.id || Utils.generateId() };
   await this._idbPut(store, item);
   if (this.useCloud) await this._firestorePut(store, item);
   return item;
 },

 async remove(store, id) {
   await this._idbDelete(store, id);
   if (this.useCloud) await this._firestoreDelete(store, id);
 },

 async clearStore(store) {
   await this._idbClear(store);
   if (this.useCloud) await this._firestoreClear(store);
 },

 async clearAll() {
   const stores = ['transactions', 'events', 'fitnessPlans', 'dietPlans', 'categories'];
   for (const s of stores) {
     await this.clearStore(s);
   }
 },

 async exportAll() {
   const stores = ['transactions', 'events', 'fitnessPlans', 'dietPlans', 'categories'];
   const data = {};
   for (const s of stores) {
     data[s] = await this._idbGetAll(s);
   }
   return { ...data, exportDate: Utils.today() };
 },

 async importAll(data) {
   const stores = ['transactions', 'events', 'fitnessPlans', 'dietPlans', 'categories'];
   for (const s of stores) {
     if (data[s]) {
       await this._idbClear(s);
       for (const item of data[s]) {
         await this._idbPut(s, item);
         if (this.useCloud) await this._firestorePut(s, item);
       }
     }
   }
 },

 // Real-time subscription (for cloud mode)
 subscribe(store, callback) {
   if (!this.listeners[store]) this.listeners[store] = [];
   this.listeners[store].push(callback);

   if (this.useCloud) {

       this.listeners[store] = this.listeners[store].filter(cb => cb !== callback);

   };

/**
* OCR 截图识别工具 — 使用 Tesseract.js 进行浏览器端文字识别
* 支持识别支付截图中的金额、日期、商户名，并自动匹配分类
*/
window.OCRUtil = {

 worker: null,

 async initWorker() {
   if (this.worker) return this.worker;
   this.worker = await Tesseract.createWorker('chi_sim+eng', 1, {
     logger: () => {},
   });
   return this.worker;
 },

 async recognize(file, onProgress) {
   const worker = await this.initWorker();
   const { data } = await worker.recognize(file);
   return data.text;
 },

 // ===== 智能解析 OCR 文本 =====
 parseReceipt(text) {
   const result = {
     amount: null,
     date: null,
     merchant: '',
     category: '',
     type: 'expense',
     rawText: text,
     possibleItems: [],
   };

   // 识别金额：匹配 ¥符号后面的数字 或 纯数字带小数点
   const amountPatterns = [
     /[¥￥]\s*(\d+[.,]?\d*)/,
     /金额[：:]\s*[¥￥]?\s*(\d+[.,]?\d*)/,
     /(\d+[.]\d{2})\s*元/,
     /支付[金额]*[：:]\s*[¥￥]?\s*(\d+[.,]?\d*)/,
     /实付[：:]\s*[¥￥]?\s*(\d+[.,]?\d*)/,
     /实收[：:]\s*[¥￥]?\s*(\d+[.,]?\d*)/,
   ];

   for (const pattern of amountPatterns) {
     const match = text.match(pattern);
     if (match && match[1]) {
       const num = match[1].replace(',', '.');
       result.amount = Number(num);
       if (pattern.source.includes('实收') || pattern.source.includes('收入') || pattern.source.includes('退款') || pattern.source.includes('到账')) {
         result.type = 'income';
       }
       break;
     }
   }

   // 如果没匹配到特定模式，尝试通用金额匹配
   if (!result.amount) {
     const allAmounts = text.match(/[¥￥]\s*(\d+[.,]?\d*)/g);
     if (allAmounts && allAmounts.length > 0) {
       const nums = allAmounts.map(s => Number(s.replace(/[¥￥,\s]/g, '').replace(',', '.')));
       result.amount = nums.reduce((max, n) => n > max ? n : max, 0);
     }
   }

   // 识别日期
   const datePatterns = [
     /(\d{4}[-年]\d{1,2}[-月]\d{1,2})/,
     /(\d{4}\/\d{1,2}\/\d{1,2})/,
     /(\d{4}\.\d{1,2}\.\d{1,2})/,
   ];

   for (const pattern of datePatterns) {
     const match = text.match(pattern);
     if (match && match[1]) {
       let dateStr = match[1]
         .replace('年', '-').replace('月', '-')
         .replace(/\//g, '-').replace(/\./g, '-');
       const parts = dateStr.split('-');
       if (parts.length === 3) {
         result.date = `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`;
       }
       break;
     }
   }

   // 如果没识别到日期，尝试匹配时间
   if (!result.date) {
     const timeMatch = text.match(/(\d{4}-\d{2}-\d{2})/);
     if (timeMatch) result.date = timeMatch[1];
   }

   // 如果还没日期，用今天
   if (!result.date) result.date = Utils.today();

   // 识别商户名和分类
   result.category = this.matchCategory(text);
   result.merchant = this.extractMerchant(text);

   // 收入关键词检测
   const incomeKeywords = ['收款', '到账', '退款', '收入', '转入', '工资', '收益', '红包', '转账收入'];
   for (const kw of incomeKeywords) {
     if (text.includes(kw)) {
       result.type = 'income';
       break;
     }
   }

   return result;
 },

 // 分类关键词匹配
 categoryKeywords: {
   '餐饮': ['美团', '饿了么', '肯德基', '麦当劳', '星巴克', '餐厅', '饭', '面', '外卖', '食', '餐', '咖啡', '奶茶', '茶', '小吃', '烧烤', '火锅', '便利店', '超市', '7-11', '罗森', '叮咚', '盒马', '生鲜', '烘焙', '面包', '蛋糕', '饮', '酒'],
   '交通': ['滴滴', '出行', '地铁', '公交', '高铁', '火车', '机票', '航空', '打车', '停车', '加油', '充电', 'ETC', '共享单车', '哈啰', '12306', '铁路', '航班'],
   '购物': ['淘宝', '天猫', '京东', '拼多多', '苏宁', '唯品会', '购物', '商城', '旗舰店', '百货', '优衣库', 'ZARA', '数码', '电子', '服饰', '鞋', '包', '化妆品', '护肤'],
   '住房': ['房租', '物业', '水电', '燃气', '宽带', '网费', '电费', '水费', '天然气', '供暖', '暖气'],
   '娱乐': ['电影', '票', 'KTV', '游戏', 'Steam', '视频', '会员', '音乐', '演出', '剧本杀', '密室', '游乐', '腾讯视频', '爱奇艺', '优酷', 'B站', '哔哩'],
   '医疗': ['医院', '药', '诊所', '挂号', '体检', '齿科', '眼科', '美容', '口腔', '药房', '健康'],
   '教育': ['学', '培训', '课程', '书', '考试', '报名', '学费', '教育', '知网', '网课', '知识'],
   '其他支出': ['转账', '红包', '代付', 'AA'],
 },

 matchCategory(text) {
   let bestMatch = '';
   let bestScore = 0;

   for (const [category, keywords] of Object.entries(this.categoryKeywords)) {
     let score = 0;
     for (const kw of keywords) {
       if (text.includes(kw)) score++;
     }
     if (score > bestScore) {
       bestScore = score;
       bestMatch = category;
     }
   }

   return bestMatch;
 },

 extractMerchant(text) {
   // 尝试提取商户名
   const patterns = [
     /商户[：:]\s*(.+?)[\n\r]/,
     /收款方[：:]\s*(.+?)[\n\r]/,
     /付款给\s*(.+?)[\n\r]/,
     /向(.+?)付款/,
   ];

   for (const pattern of patterns) {
     const match = text.match(pattern);
     if (match && match[1]) {
       return match[1].trim().slice(0, 20);
     }
   }

   return '';
 },
};

 setup() {
   const { computed } = Vue;
   const today = Utils.today();

   const greeting = computed(() => {
     const h = new Date().getHours();
     if (h < 6) return '凌晨好';
     if (h < 9) return '早上好';
     if (h < 12) return '上午好';
     if (h < 14) return '中午好';
     if (h < 18) return '下午好';
     if (h < 22) return '晚上好';
     return '夜深了';
   });

   const todayLabel = computed(() => {
     const d = new Date();
     const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
     return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 ${days[d.getDay()]}`;
   });

   const summary = computed(() => Store.getMonthlySummary(Utils.currentMonth()));

   const todayEvents = computed(() => Store.getTodayEvents());

   const todayFitness = computed(() => Store.getTodayFitness());

   const fitnessCompleted = computed(() => {
     return todayFitness.value.filter(e => e.completedDate === today).length;
   });

   const todayDiet = computed(() => Store.getTodayDiet());

   const dietCalories = computed(() => {
     return todayDiet.value.reduce((sum, f) => sum + (Number(f.calories) || 0), 0);
   });

   const mealTypes = [
     { key: 'breakfast', label: '早餐', icon: '🌅' },
     { key: 'lunch', label: '午餐', icon: '☀️' },
     { key: 'dinner', label: '晚餐', icon: '🌙' },
     { key: 'snack', label: '加餐', icon: '🍎' },
   ];

   function getMealFoods(mealType) {
     return todayDiet.value.filter(f => f.mealType === mealType);
   }

   function getCategoryStyle(name) {
     const color = Store.getCategoryColor('calendar', name);
     return { background: color + '22', color };
   }

   function getCategoryIcon(module, name) {
     const cats = Store.getAllCategoriesForModule(module);
     const cat = cats.find(c => c.name === name);
     return cat ? cat.icon : '📌';
   }

   function goTo(module) {
     Store.navigate(module);
   }

   async function toggleFitness(ex) {
     const completed = ex.completedDate === today;
     await Store.updateFitnessPlan(ex.id, {
       completedDate: completed ? '' : today
     });
   }

   return {
     Utils, today, greeting, todayLabel, summary,
     todayEvents, todayFitness, fitnessCompleted, todayDiet, dietCalories,
     mealTypes, getMealFoods, getCategoryStyle, getCategoryIcon, goTo, toggleFitness,
   };
 }
};

           <div class="form-group">
             <label class="form-label">金额</label>
             <input type="number" class="form-input" v-model="form.amount" placeholder="0.00" step="0.01" min="0" />
           </div>
           <div class="form-row">
             <div class="form-group">
               <label class="form-label">分类</label>
               <select class="form-select" v-model="form.category">
                 <option value="">请选择</option>
                 <option v-for="cat in categoriesByType" :key="cat.name" :value="cat.name">
                   {{ cat.icon }} {{ cat.name }}
                 </option>
               </select>
             </div>
             <div class="form-group">
               <label class="form-label">日期</label>
               <input type="date" class="form-input" v-model="form.date" />
             </div>
           </div>
           <div class="form-group">
             <label class="form-label">备注</label>
             <textarea class="form-textarea" v-model="form.note" placeholder="可选..."></textarea>
           </div>
         </div>
         <div class="modal-footer">
           <button class="btn btn-secondary" @click="closeModal">取消</button>
           <button class="btn btn-primary" @click="saveTransaction">保存</button>
         </div>
       </div>
     </div>
   </div>
 `,

 setup() {
   const { ref, computed } = Vue;
   const currentMonth = ref(Utils.currentMonth());
   const filterCategory = ref('');
   const filterType = ref('');
   const showModal = ref(false);
   const editing = ref(false);
   const form = ref({ type: 'expense', amount: '', category: '', date: Utils.today(), note: '' });

   // OCR related state
   const ocrFileInput = ref(null);
   const ocrLoading = ref(false);
   const showOCRResult = ref(false);
   const ocrResult = ref(null);
   const ocrPreviewUrl = ref('');
   const ocrForm = ref({ type: 'expense', amount: '', category: '', date: Utils.today(), note: '' });
   const lastOCRFile = ref(null);

   const allCategories = computed(() => Store.getAllCategoriesForModule('accounting'));

   const categoriesByType = computed(() => {
     return allCategories.value.filter(c => c.type === form.value.type);
   });

   const ocrCategoriesByType = computed(() => {
     return allCategories.value.filter(c => c.type === ocrForm.value.type);
   });

   const monthTxns = computed(() => {
     return Store.state.transactions
       .filter(t => Utils.getMonthString(t.date) === currentMonth.value)
       .sort((a, b) => (b.date || '').localeCompare(a.date || ''));
   });

   const filteredTransactions = computed(() => {
     let list = monthTxns.value;
     if (filterCategory.value) list = list.filter(t => t.category === filterCategory.value);
     if (filterType.value) list = list.filter(t => t.type === filterType.value);
     return list;
   });

   const summary = computed(() => Store.getMonthlySummary(currentMonth.value));

   const displayMonth = computed(() => {
     const [y, m] = currentMonth.value.split('-');
     return `${y}年${parseInt(m)}月`;
   });

   const currentYear = computed(() => currentMonth.value.split('-')[0]);
   const yearlySummary = computed(() => Store.getYearlySummary(currentYear.value));

   const expenseByCategory = computed(() => Store.getCategoryBreakdown(currentMonth.value, 'expense'));
   const incomeByCategory = computed(() => Store.getCategoryBreakdown(currentMonth.value, 'income'));
   const yearlyExpenseByCategory = computed(() => Store.getYearlyCategoryBreakdown(currentYear.value, 'expense'));
   const yearlyIncomeByCategory = computed(() => Store.getYearlyCategoryBreakdown(currentYear.value, 'income'));

   const todaySummary = computed(() => {
     const today = Utils.today();
     const txns = Store.state.transactions.filter(t => t.date === today);
     return {
       income: txns.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0),
       expense: txns.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0),
     };
   });

   const todayDateStr = computed(() => {
     const d = new Date();
     return `${d.getFullYear()}年${String(d.getMonth() + 1).padStart(2, '0')}月${String(d.getDate()).padStart(2, '0')}日`;
   });

   const monthRangeStr = computed(() => {
     const [y, m] = currentMonth.value.split('-');
     const days = new Date(parseInt(y), parseInt(m), 0).getDate();
     return `${parseInt(m)}月01日-${parseInt(m)}月${days}日`;
   });

   const incomeCount = computed(() => monthTxns.value.filter(t => t.type === 'income').length);

   function generatePieSegments(categories, total) {
     if (total <= 0 || categories.length === 0) return [];
     const r = 80, cx = 100, cy = 100;
     let angle = -Math.PI / 2;
     return categories.map(cat => {
       const portion = cat.amount / total;
       const endAngle = angle + portion * 2 * Math.PI;
       const x1 = cx + r * Math.cos(angle);
       const y1 = cy + r * Math.sin(angle);
       const x2 = cx + r * Math.cos(endAngle);
       const y2 = cy + r * Math.sin(endAngle);
       const largeArc = portion > 0.5 ? 1 : 0;
       const path = `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} Z`;
       angle = endAngle;
       return { path, color: cat.color, name: cat.name, amount: cat.amount };
     });
   }

   const expensePieSegments = computed(() => generatePieSegments(expenseByCategory.value, summary.value.expense));
   const incomePieSegments = computed(() => generatePieSegments(incomeByCategory.value, summary.value.income));
   const yearlyExpensePieSegments = computed(() => generatePieSegments(yearlyExpenseByCategory.value, yearlySummary.value.expense));
   const yearlyIncomePieSegments = computed(() => generatePieSegments(yearlyIncomeByCategory.value, yearlySummary.value.income));

   function prevMonth() {
     const [y, m] = currentMonth.value.split('-').map(Number);
     const d = new Date(y, m - 2, 1);
     currentMonth.value = Utils.getMonthString(d);
   }

   function nextMonth() {
     const [y, m] = currentMonth.value.split('-').map(Number);
     const d = new Date(y, m, 1);
     currentMonth.value = Utils.getMonthString(d);
   }

   function openAddModal() {
     editing.value = false;
     form.value = { type: 'expense', amount: '', category: '', date: Utils.today(), note: '' };
     showModal.value = true;
   }

   function openEditModal(t) {
     editing.value = true;
     form.value = { ...t };
     showModal.value = true;
   }

   function closeModal() {
     showModal.value = false;
   }

   async function saveTransaction() {
     if (!form.value.amount || Number(form.value.amount) <= 0) {
       alert('请输入金额');
       return;
     }
     const data = {
       type: form.value.type,
       amount: Number(form.value.amount),
       category: form.value.category,
       date: form.value.date,
       note: form.value.note,
     };
     if (editing.value) {
       await Store.updateTransaction(form.value.id, data);
     } else {
       await Store.addTransaction(data);
     }
     closeModal();
   }

   async function deleteTxn(t) {
     if (confirm('确定删除这条记录吗？')) {
       await Store.deleteTransaction(t.id);
     }
   }

   function getCategoryColor(name) {
     return Store.getCategoryColor('accounting', name);
   }

   function getCategoryIcon(name) {
     const cat = allCategories.value.find(c => c.name === name);
     return cat ? cat.icon : '📝';
   }

   // ===== OCR Functions =====
   function triggerOCRImport() {
     ocrFileInput.value?.click();
   }

   async function handleOCRImage(event) {
     const file = event.target.files[0];
     if (!file) return;
     lastOCRFile.value = file;
     event.target.value = '';
     await processOCR(file);
   }

   async function processOCR(file) {
     ocrLoading.value = true;
     ocrPreviewUrl.value = URL.createObjectURL(file);

     try {
       const text = await OCRUtil.recognize(file);
       const parsed = OCRUtil.parseReceipt(text);
       ocrResult.value = parsed;

       ocrForm.value = {
         type: parsed.type || 'expense',
         amount: parsed.amount || '',
         category: parsed.category || '',
         date: parsed.date || Utils.today(),
         note: parsed.merchant ? '识别自: ' + parsed.merchant : '',
       };

       ocrLoading.value = false;
       showOCRResult.value = true;
     } catch (e) {
       ocrLoading.value = false;
       alert('识别失败，请重试或手动输入\n错误: ' + e.message);
     }
   }

   async function retryOCR() {
     if (!lastOCRFile.value) return;
     showOCRResult.value = false;
     await processOCR(lastOCRFile.value);
   }

   async function saveOCRResult() {
     if (!ocrForm.value.amount || Number(ocrForm.value.amount) <= 0) {
       alert('请输入金额');
       return;
     }
     const data = {
       type: ocrForm.value.type,
       amount: Number(ocrForm.value.amount),
       category: ocrForm.value.category,
       date: ocrForm.value.date,
       note: ocrForm.value.note,
     };
     await Store.addTransaction(data);
     showOCRResult.value = false;
     if (ocrPreviewUrl.value) {
       URL.revokeObjectURL(ocrPreviewUrl.value);
       ocrPreviewUrl.value = '';
     }
   }

   return {
     Utils, currentMonth, currentYear, filterCategory, filterType, showModal, editing, form,
     allCategories, categoriesByType, filteredTransactions, summary, displayMonth,
     yearlySummary, expenseByCategory, incomeByCategory,
     yearlyExpenseByCategory, yearlyIncomeByCategory,
     expensePieSegments, incomePieSegments, yearlyExpensePieSegments, yearlyIncomePieSegments,
     todaySummary, todayDateStr, monthRangeStr, incomeCount,
     prevMonth, nextMonth, openAddModal, openEditModal, closeModal, saveTransaction, deleteTxn,
     getCategoryColor, getCategoryIcon,
     ocrFileInput, ocrLoading, showOCRResult, ocrResult, ocrPreviewUrl, ocrForm,
     ocrCategoriesByType, triggerOCRImport, handleOCRImage, retryOCR, saveOCRResult,
   };
 }
};

   const todayStr = Utils.today();

   const monthMatrix = computed(() => Utils.getMonthMatrix(viewYear.value, viewMonth.value));
   const displayMonth = computed(() => `${viewYear.value}年${viewMonth.value + 1}月`);
   const categories = computed(() => Store.getAllCategoriesForModule('calendar'));

   const selectedDayEvents = computed(() => {
     return Store.state.events
       .filter(e => e.date === selectedDate.value)
       .sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99'));
   });

   function getEventsForDate(dateStr) {
     return Store.state.events
       .filter(e => e.date === dateStr)
       .sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99'))
       .slice(0, 3);

   function selectDate(dateStr) {
     selectedDate.value = dateStr;

   function prevMonth() {
     if (viewMonth.value === 0) {
       viewMonth.value = 11;
       viewYear.value--;
     } else {
       viewMonth.value--;
     }

   function nextMonth() {
     if (viewMonth.value === 11) {

       viewYear.value++;
     } else {
       viewMonth.value++;

     if (status === 'local') return '仅本地存储，未启用云同步';

   }

   function triggerImport() {
     fileInput.value?.click();
   }

   async function importData(event) {
     const file = event.target.files[0];
     if (!file) return;
     try {
       const text = await file.text();
       const data = JSON.parse(text);
       if (confirm('导入将覆盖当前所有数据，确定继续吗？')) {
         await Store.importData(data);
         alert('导入成功');
       }
     } catch (e) {
       alert('文件格式错误，无法导入');
     }
     event.target.value = '';

     const s = Store.state.syncStatus;
     if (s === 'synced') return '已同步';
     if (s === 'offline') return '离线';
     return '仅本地';
   });

   function navigate(key) {
     Store.navigate(key);
   }

   function handleHashChange() {
     const hash = location.hash.replace('#', '');
     if (hash && navItems.some(n => n.key === hash)) {
       Store.state.currentModule = hash;
     }
   }

   onMounted(async () => {
     window.addEventListener('hashchange', handleHashChange);
     handleHashChange();
     await Store.init();
   });

   return {
     navItems, Store, currentComponent,
     syncDotClass, syncLabel, navigate,
   };
 }
};

// Register components
App.components = {
 DashboardComponent: window.DashboardComponent,
 AccountingComponent: window.AccountingComponent,
 CalendarComponent: window.CalendarComponent,
 FitnessComponent: window.FitnessComponent,
 DietComponent: window.DietComponent,
 SettingsComponent: window.SettingsComponent,
};

const app = createApp(App);
app.mount('#app');
})();

</script>
